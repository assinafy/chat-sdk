name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)."
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package signatures
        run: npm audit signatures

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          tag_version="${tag#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Tag and package.json both at version $pkg_version"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  publish-npmjs:
    name: Publish to npmjs.com
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npmjs
      url: https://www.npmjs.com/package/@assinafy/chat-sdk
    permissions:
      contents: read
      # `id-token: write` is required by `npm publish --provenance` so npm can
      # mint a signed provenance attestation via GitHub's OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"
          # Force the package scope so the publish targets npmjs even though
          # the same name is also published to GitHub Packages.
          scope: "@assinafy"
          always-auth: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish to npmjs (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-packages
      url: https://github.com/${{ github.repository }}/pkgs/npm/chat-sdk
    permissions:
      contents: read
      packages: write
      # Required for `npm publish --provenance` against GitHub Packages too.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # GitHub Packages requires the package scope to match the repo owner.
          # @assinafy already matches; setup-node writes ~/.npmrc accordingly.
          registry-url: "https://npm.pkg.github.com"
          scope: "@assinafy"
          always-auth: true

      - name: Install dependencies
        # Install against the npmjs registry — only the publish step targets
        # GitHub Packages. Otherwise transitive deps fail to resolve.
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages (with provenance)
        run: npm publish --provenance --access public
        env:
          # GitHub Packages authenticates with the built-in GITHUB_TOKEN; no
          # extra secret needs to be configured.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
