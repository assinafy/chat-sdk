name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package signatures
        run: npm audit signatures

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$pkg_version" ]; then
            echo "::error::Tag $tag must be exactly v$pkg_version"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::$tag is not an existing Git tag."
            exit 1
          fi
          echo "Tag and package.json both at version $pkg_version"

      - name: Verify tag commit belongs to main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify SDK
        run: npm run verify

      - name: Require sandbox credentials
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
        run: |
          if [ -z "$ASSINAFY_API_KEY" ] || [ -z "$ASSINAFY_ACCOUNT_ID" ]; then
            echo "::error::ASSINAFY_API_KEY and ASSINAFY_ACCOUNT_ID are required for release verification."
            exit 1
          fi

      - name: Verify against the sandbox
        env:
          ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_TEST_NOTIFICATIONS: "0"
        run: npm run test:integration

      - name: Pack release artifact
        run: npm pack --ignore-scripts

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 30
          if-no-files-found: error

  publish-npmjs:
    name: Publish to npmjs.com
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npmjs
      url: https://www.npmjs.com/package/@assinafy/chat-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
          scope: "@assinafy"

      - name: Publish to npmjs with OIDC
        run: npm publish ./package/*.tgz --access public

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-packages
      url: https://github.com/${{ github.repository }}/pkgs/npm/chat-sdk
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@assinafy"

      - name: Publish to GitHub Packages
        run: npm publish ./package/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
