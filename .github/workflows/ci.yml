name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands so we don't
# burn minutes on stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only permissions. Individual jobs widen this only if needed.
permissions:
  contents: read

jobs:
  unit:
    name: Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 20 = compatibility floor (engines >=20, EOL Apr 2026);
        # 22 = maintenance LTS; 24 = active LTS.
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package signatures
        run: npm audit signatures

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload dist (Node 22 only)
        if: matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  integration:
    name: Integration (sandbox)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    # Skip pull requests from forks — they don't have access to the sandbox
    # secrets, and exposing secrets to fork code would be unsafe regardless.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Detect sandbox credentials
        id: creds
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
        run: |
          if [ -n "$ASSINAFY_API_KEY" ] && [ -n "$ASSINAFY_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sandbox secrets not configured; skipping integration tests."
          fi

      - name: Run integration tests
        if: steps.creds.outputs.configured == 'true'
        env:
          ASSINAFY_BASE_URL: ${{ vars.ASSINAFY_BASE_URL || 'https://sandbox.assinafy.com.br/v1' }}
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_TEST_EMAIL_PRIMARY: ${{ vars.ASSINAFY_TEST_EMAIL_PRIMARY || 'bill@febacapital.com' }}
          ASSINAFY_TEST_EMAIL_SECONDARY: ${{ vars.ASSINAFY_TEST_EMAIL_SECONDARY || 'billm@billm.org' }}
        run: npm run test:integration

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run actionlint
        # Pinned version (not :latest) for reproducible, supply-chain-safe runs.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
