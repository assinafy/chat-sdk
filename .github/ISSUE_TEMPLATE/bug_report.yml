name: Bug report
description: A reproducible problem with the SDK
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I call `client.documents.upload(...)`, …
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimum code snippet that reproduces the issue.
      render: ts
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "@assinafy/chat-sdk 2.0.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v24.20.0
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Production (api.assinafy.com.br)
        - Sandbox (sandbox.assinafy.com.br)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Redact API keys, access tokens, signer codes, and signing URLs before submitting.
      render: shell
